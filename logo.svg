<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" style="background:#0f0a2a;">
  <!-- Star field -->
  <circle cx="80"  cy="60"  r="1.2" fill="#a78bfa" opacity="0.7"/>
  <circle cx="150" cy="30"  r="0.8" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="220" cy="80"  r="1.0" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="310" cy="20"  r="1.4" fill="#a78bfa" opacity="0.8"/>
  <circle cx="400" cy="55"  r="0.9" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="480" cy="35"  r="1.1" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="560" cy="70"  r="0.8" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="610" cy="28"  r="1.3" fill="#a78bfa" opacity="0.8"/>
  <circle cx="640" cy="90"  r="0.7" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="55"  cy="130" r="0.9" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="625" cy="140" r="1.0" fill="#a78bfa" opacity="0.6"/>
  <circle cx="340" cy="360" r="0.8" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="120" cy="350" r="1.0" fill="#a78bfa" opacity="0.5"/>
  <circle cx="570" cy="345" r="0.9" fill="#e2e8f0" opacity="0.4"/>

  <!-- Crescent moon -->
  <circle cx="340" cy="175" r="72" fill="#1e1b4b"/>
  <circle cx="368" cy="158" r="58" fill="#0f0a2a"/>

  <!-- Moon glow ring -->
  <circle cx="340" cy="175" r="80" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
  <circle cx="340" cy="175" r="88" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.15"/>

  <!-- Stars on the crescent -->
  <circle cx="295" cy="148" r="2.5" fill="#c4b5fd" opacity="0.9"/>
  <circle cx="308" cy="210" r="1.8" fill="#a78bfa" opacity="0.8"/>
  <circle cx="275" cy="185" r="1.4" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="320" cy="230" r="1.2" fill="#c4b5fd" opacity="0.6"/>

  <!-- NYX wordmark -->
  <text x="340" y="303" text-anchor="middle"
        font-family="sans-serif" font-weight="500" letter-spacing="0.18em"
        font-size="52" fill="#e2e8f0">NYX</text>

  <!-- OS sub-label -->
  <text x="340" y="332" text-anchor="middle"
        font-family="sans-serif" font-weight="400" letter-spacing="0.35em"
        font-size="13" fill="#7c3aed">O P E R A T I N G   S Y S T E M</text>

  <!-- Thin divider lines -->
  <line x1="240" y1="312" x2="300" y2="312" stroke="#7c3aed" stroke-width="0.5" opacity="0.6"/>
  <line x1="380" y1="312" x2="440" y2="312" stroke="#7c3aed" stroke-width="0.5" opacity="0.6"/>
</svg>
